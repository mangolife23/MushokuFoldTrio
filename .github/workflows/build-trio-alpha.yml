name: Build MushokuFoldTrio Alpha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-trio-alpha.yml
      - scripts/patch_real_duo_trio.py
      - scripts/apply_trio_focus_framing.py
      - scripts/apply_trio_background_layer.py
      - trio_roxy.jpg
      - trio_sylphie.jpg
      - trio_eris.jpg
  workflow_dispatch:

jobs:
  build-trio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Trio integration repository
        uses: actions/checkout@v4

      - name: Checkout pinned genuine DuoLauncher
        uses: actions/checkout@v4
        with:
          repository: jakesgoodapps/DuoLauncher
          ref: f1bc0f1c5a76637f3fc46a60beed5c331b5fd917
          path: duo-stock

      - name: Verify pinned upstream commit
        run: |
          EXPECTED="f1bc0f1c5a76637f3fc46a60beed5c331b5fd917"
          ACTUAL="$(git -C duo-stock rev-parse HEAD)"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Package Trio artwork
        run: |
          test -f trio_roxy.jpg
          test -f trio_sylphie.jpg
          test -f trio_eris.jpg
          mkdir -p duo-stock/app/src/main/res/drawable-nodpi
          cp trio_roxy.jpg duo-stock/app/src/main/res/drawable-nodpi/trio_roxy.jpg
          cp trio_sylphie.jpg duo-stock/app/src/main/res/drawable-nodpi/trio_sylphie.jpg
          cp trio_eris.jpg duo-stock/app/src/main/res/drawable-nodpi/trio_eris.jpg
          ls -lh duo-stock/app/src/main/res/drawable-nodpi/trio_*.jpg
          sha256sum trio_roxy.jpg trio_sylphie.jpg trio_eris.jpg

      - name: Patch genuine Duo with Fold7-safe Trio foundation
        run: |
          python3 scripts/patch_real_duo_trio.py duo-stock
          python3 scripts/apply_trio_focus_framing.py duo-stock
          python3 scripts/apply_trio_background_layer.py duo-stock

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build genuine DuoLauncher Trio Alpha
        working-directory: duo-stock
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and fingerprint APK
        run: |
          test -f duo-stock/app/build/outputs/apk/debug/app-debug.apk
          cp duo-stock/app/build/outputs/apk/debug/app-debug.apk MushokuFoldTrio-Alpha-3.apk
          sha256sum MushokuFoldTrio-Alpha-3.apk | tee MushokuFoldTrio-Alpha-3.sha256

      - name: Generate APK security provenance report
        run: |
          APK="MushokuFoldTrio-Alpha-3.apk"
          AAPT="/usr/local/lib/android/sdk/build-tools/36.0.0/aapt2"
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner"
          {
            echo "MushokuFoldTrio APK security provenance"
            echo "======================================"
            echo "integration_commit=$(git rev-parse HEAD)"
            echo "upstream_duo_commit=$(git -C duo-stock rev-parse HEAD)"
            echo
            echo "SHA-256"
            sha256sum "$APK"
            echo
            echo "APK signing certificate"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo
            echo "Manifest permissions/features"
            "$AAPT" dump permissions "$APK"
            echo
            echo "Badging/package identity"
            "$AAPT" dump badging "$APK" | head -n 40
          } | tee MushokuFoldTrio-Alpha-3-security.txt

      - name: Upload MushokuFoldTrio Alpha
        uses: actions/upload-artifact@v4
        with:
          name: MushokuFoldTrio-Alpha-3
          path: |
            MushokuFoldTrio-Alpha-3.apk
            MushokuFoldTrio-Alpha-3.sha256
            MushokuFoldTrio-Alpha-3-security.txt
          if-no-files-found: error
