name: Build MushokuFoldTrio Native Prototype

on:
  push:
    branches:
      - native-animation-prototype
    paths:
      - .github/workflows/build-trio-alpha.yml
      - scripts/patch_real_duo_trio.py
      - scripts/apply_trio_focus_framing.py
      - scripts/apply_trio_background_layer.py
      - scripts/apply_trio_app_search.py
      - scripts/apply_trio_discover_diagnostics.py
      - scripts/apply_trio_readability.py
      - scripts/apply_trio_eris_motion.py
      - scripts/apply_trio_feed_bounds_diagnostics.py
      - scripts/configure_trio_signing.py
      - trio_roxy.jpg
      - trio_roxy_cutout.png
      - trio_sylphie.jpg
      - trio_eris.jpg
  workflow_dispatch:

jobs:
  build-trio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Trio integration repository
        uses: actions/checkout@v4

      - name: Checkout pinned genuine DuoLauncher
        uses: actions/checkout@v4
        with:
          repository: jakesgoodapps/DuoLauncher
          ref: f1bc0f1c5a76637f3fc46a60beed5c331b5fd917
          path: duo-stock
          persist-credentials: false

      - name: Verify pinned upstream commit
        run: |
          EXPECTED="f1bc0f1c5a76637f3fc46a60beed5c331b5fd917"
          ACTUAL="$(git -C duo-stock rev-parse HEAD)"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Give prototype an isolated Android identity
        run: |
          sed -i 's/applicationId = "com.jake.duolauncher"/applicationId = "com.otakuhoarder.mushokufold.nativeprototype"/' duo-stock/app/build.gradle.kts
          grep -F 'applicationId = "com.otakuhoarder.mushokufold.nativeprototype"' duo-stock/app/build.gradle.kts
          python3 scripts/configure_trio_signing.py duo-stock

      - name: Package Trio artwork
        run: |
          test -f trio_roxy.jpg
          test -f trio_roxy_cutout.png
          test -f trio_sylphie.jpg
          test -f trio_eris.jpg
          mkdir -p duo-stock/app/src/main/res/drawable-nodpi
          cp trio_roxy.jpg duo-stock/app/src/main/res/drawable-nodpi/trio_roxy.jpg
          cp trio_roxy_cutout.png duo-stock/app/src/main/res/drawable-nodpi/trio_roxy_cutout.png
          cp trio_sylphie.jpg duo-stock/app/src/main/res/drawable-nodpi/trio_sylphie.jpg
          cp trio_eris.jpg duo-stock/app/src/main/res/drawable-nodpi/trio_eris.jpg
          ls -lh duo-stock/app/src/main/res/drawable-nodpi/trio_*
          sha256sum trio_roxy.jpg trio_roxy_cutout.png trio_sylphie.jpg trio_eris.jpg

      - name: Patch genuine Duo with Fold7-safe Trio foundation
        run: |
          python3 scripts/patch_real_duo_trio.py duo-stock
          python3 scripts/apply_trio_focus_framing.py duo-stock
          python3 scripts/apply_trio_background_layer.py duo-stock
          python3 scripts/apply_trio_app_search.py duo-stock
          python3 scripts/apply_trio_discover_diagnostics.py duo-stock
          python3 scripts/apply_trio_readability.py duo-stock
          python3 scripts/apply_trio_eris_motion.py duo-stock
          python3 scripts/apply_trio_feed_bounds_diagnostics.py duo-stock

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Record Gradle dependency provenance
        working-directory: duo-stock
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:dependencies > ../MushokuFoldNativePrototype-dependencies.txt
          sha256sum gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties >> ../MushokuFoldNativePrototype-dependencies.txt

      - name: Build native prototype
        working-directory: duo-stock
        env:
          TRIO_KEYSTORE_BASE64: ${{ secrets.TRIO_KEYSTORE_BASE64 }}
          TRIO_STORE_PASSWORD: ${{ secrets.TRIO_STORE_PASSWORD }}
          TRIO_KEY_ALIAS: ${{ secrets.TRIO_KEY_ALIAS }}
          TRIO_KEY_PASSWORD: ${{ secrets.TRIO_KEY_PASSWORD }}
        run: |
          if [ -n "$TRIO_KEYSTORE_BASE64" ]; then
            test -n "$TRIO_STORE_PASSWORD" && test -n "$TRIO_KEY_ALIAS" && test -n "$TRIO_KEY_PASSWORD"
            printf '%s' "$TRIO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trio-signing.jks"
            chmod 600 "$RUNNER_TEMP/trio-signing.jks"
            export DUO_RELEASE_STORE_FILE="$RUNNER_TEMP/trio-signing.jks"
            export DUO_RELEASE_STORE_PASSWORD="$TRIO_STORE_PASSWORD"
            export DUO_RELEASE_KEY_ALIAS="$TRIO_KEY_ALIAS"
            export DUO_RELEASE_KEY_PASSWORD="$TRIO_KEY_PASSWORD"
            echo 'TRIO_SIGNING_MODE=stable' >> "$GITHUB_ENV"
          else
            test -z "$TRIO_STORE_PASSWORD" && test -z "$TRIO_KEY_ALIAS" && test -z "$TRIO_KEY_PASSWORD"
            echo 'TRIO_SIGNING_MODE=ephemeral-debug' >> "$GITHUB_ENV"
          fi
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and fingerprint APK
        run: |
          test -f duo-stock/app/build/outputs/apk/debug/app-debug.apk
          cp duo-stock/app/build/outputs/apk/debug/app-debug.apk MushokuFoldNativePrototype.apk
          sha256sum MushokuFoldNativePrototype.apk | tee MushokuFoldNativePrototype.sha256

      - name: Generate APK security provenance report
        run: |
          APK="MushokuFoldNativePrototype.apk"
          AAPT="/usr/local/lib/android/sdk/build-tools/36.0.0/aapt2"
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner"
          {
            echo "MushokuFoldTrio APK security provenance"
            echo "======================================"
            echo "integration_commit=$(git rev-parse HEAD)"
            echo "upstream_duo_commit=$(git -C duo-stock rev-parse HEAD)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "prototype_signing_mode=${TRIO_SIGNING_MODE:-unknown}"
            echo
            echo "Toolchain"
            java -version 2>&1
            (cd duo-stock && ./gradlew --version)
            "$AAPT" version
            "$APKSIGNER" version
            echo
            echo "SHA-256"
            sha256sum "$APK"
            echo
            echo "APK signing certificate"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo
            echo "Manifest permissions/features"
            "$AAPT" dump permissions "$APK"
            echo
            echo "Badging/package identity"
            "$AAPT" dump badging "$APK" | head -n 40
          } | tee MushokuFoldNativePrototype-security.txt

      - name: Upload native prototype
        uses: actions/upload-artifact@v4
        with:
          name: MushokuFoldNativePrototype
          path: |
            MushokuFoldNativePrototype.apk
            MushokuFoldNativePrototype.sha256
            MushokuFoldNativePrototype-security.txt
            MushokuFoldNativePrototype-dependencies.txt
          if-no-files-found: error
