name: Build Mushoku Home

on:
  push:
    branches: [native-animation-prototype]
    paths:
      - standalone-home/**
      - .github/workflows/build-mushoku-home.yml
  workflow_dispatch:

jobs:
  build-home:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build independent home app
        working-directory: standalone-home
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Verify Android home role and APK
        run: |
          APK=standalone-home/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/36.0.0/aapt dump badging "$APK" | tee MushokuHome-badging.txt
          grep -F "package: name='com.otakuhoarder.mushokuhome'" MushokuHome-badging.txt
          /usr/local/lib/android/sdk/build-tools/36.0.0/aapt dump xmltree "$APK" AndroidManifest.xml > MushokuHome-manifest.txt
          grep -F 'android.intent.category.HOME' MushokuHome-manifest.txt
          grep -F 'android.service.wallpaper.WallpaperService' MushokuHome-manifest.txt
          grep -F 'android.permission.BIND_WALLPAPER' MushokuHome-manifest.txt
          cp "$APK" MushokuHome.apk
          sha256sum MushokuHome.apk > MushokuHome.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MushokuHome
          path: |
            MushokuHome.apk
            MushokuHome.sha256
            MushokuHome-badging.txt
            MushokuHome-manifest.txt
          if-no-files-found: error
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test Home and live wallpaper preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb shell wm size 1080x2400
            sleep 15
            adb install MushokuHome.apk
            adb logcat -c
            adb shell am start -n com.otakuhoarder.mushokuhome/.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/mushoku-home.png
            adb pull /sdcard/mushoku-home.png MushokuHome-home.png
            adb shell am start -a android.service.wallpaper.CHANGE_LIVE_WALLPAPER --ecn android.service.wallpaper.extra.LIVE_WALLPAPER_COMPONENT com.otakuhoarder.mushokuhome/.TrioLiveWallpaperService
            sleep 12
            adb shell screencap -p /sdcard/mushoku-preview.png
            adb pull /sdcard/mushoku-preview.png MushokuHome-preview.png
            adb shell input tap 540 2150
            sleep 3
            adb shell input tap 540 1800
            sleep 8
            adb shell screencap -p /sdcard/mushoku-applied.png
            adb pull /sdcard/mushoku-applied.png MushokuHome-applied.png
            adb shell dumpsys wallpaper > MushokuHome-wallpaper-state.txt
            adb logcat -d > MushokuHome-emulator.log
            grep -F 'First wallpaper frame posted' MushokuHome-emulator.log
            ! grep -E 'FATAL EXCEPTION.*|OutOfMemoryError' MushokuHome-emulator.log
      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MushokuHome-preview-diagnostics
          path: |
            MushokuHome-home.png
            MushokuHome-preview.png
            MushokuHome-applied.png
            MushokuHome-wallpaper-state.txt
            MushokuHome-emulator.log
          if-no-files-found: ignore
